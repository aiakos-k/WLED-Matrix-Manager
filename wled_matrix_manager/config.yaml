# https://contributors.home-assistant.io/apps/reference/configuration/
# Note: no "image:" field here intentionally.
# Local dev: the Supervisor builds the add-on from the Dockerfile
# (the HA UI "Install" button builds it locally).
# CI: .github/workflows/builder.yaml publishes the images via IMAGE_PATTERN.
name: WLED Matrix Manager
version: "0.10.2"
slug: wled_matrix_manager
description: Create and manage pixel-art scenes for WLED LED matrices
url: "https://github.com/aiakos-k/WLED-Matrix-Manager/tree/main/wled_matrix_manager"
arch:
  - aarch64
  - amd64
init: false
apparmor: false
ingress: true
ingress_port: 8000
ingress_entry: /
panel_icon: mdi:led-strip-variant
panel_title: WLED Matrix Manager
homeassistant_api: true
hassio_api: true
hassio_role: admin
map:
  - share:rw
  - app_config:rw
options:
  log_level: info
schema:
  log_level: "list(debug|info|warning|error)?"
