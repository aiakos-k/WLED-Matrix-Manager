name: Builder

env:
  # Image naming for the published images. The add-on config.yaml deliberately
  # has no "image:" field, so that the Supervisor builds the add-on locally
  # from the Dockerfile. The pattern is used here for the CI only.
  #
  # All architectures share ONE package: the per-architecture images are pushed
  # as "<version>-<arch>", the multi-arch manifest is created from them in the
  # same package. Publishing the manifest into a second package is not possible
  # with GITHUB_TOKEN - GHCR denies the cross-package copy with "403 denied".
  IMAGE_PATTERN: "ghcr.io/${{ github.repository_owner }}/addon-wled-matrix-manager"
  MONITORED_FILES: "config.json config.yaml config.yml Dockerfile rootfs"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_addons: ${{ steps.filter.outputs.changed_addons }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@v47

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Filter changed add-ons
        id: filter
        env:
          ADDONS: ${{ steps.addons.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
        run: |
          changed_addons=()

          # If the workflow itself changed, rebuild all add-ons
          if [[ "${CHANGED_FILES}" =~ \.github/workflows/builder\.yaml ]]; then
            changed_addons=(${ADDONS})
          else
            for addon in ${ADDONS}; do
              for file in ${MONITORED_FILES}; do
                if [[ "${CHANGED_FILES}" =~ ${addon}/${file} ]]; then
                  changed_addons+=("${addon}")
                  break
                fi
              done
            done
          fi

          if [[ ${#changed_addons[@]} -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_addons=$(jq -nc '$ARGS.positional' --args "${changed_addons[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.addon }} (${{ matrix.arch }})
    needs: init
    if: needs.init.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
        arch: ["aarch64", "amd64"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get add-on information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Normalize add-on metadata
        id: meta
        shell: bash
        env:
          RAW_VERSION: ${{ steps.info.outputs.version }}
          RAW_NAME: ${{ steps.info.outputs.name }}
          RAW_DESCRIPTION: ${{ steps.info.outputs.description }}
        run: |
          # The info helper returns the raw values from config.yaml, including
          # the surrounding quotes. They must be removed for image tags and labels.
          strip() {
            local value="$1"
            value="${value//\"/}"
            value="${value//\'/}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            echo "${value}"
          }
          {
            echo "version=$(strip "${RAW_VERSION}")"
            echo "name=$(strip "${RAW_NAME}")"
            echo "description=$(strip "${RAW_DESCRIPTION}")"
          } >> "$GITHUB_OUTPUT"

      - name: Determine image names
        id: names
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          registry_prefix="${IMAGE_PATTERN%/*}"
          image_name="${IMAGE_PATTERN##*/}"
          echo "registry_prefix=${registry_prefix}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "image=${registry_prefix}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ matrix.addon }}"
          image: ${{ steps.names.outputs.image }}
          image-tags: |
            ${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          cache-image-tag: ${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          # The images are not signed with Cosign - the cache image verification
          # would only fail with "no signatures found" on every run.
          cosign: false
          labels: |
            io.hass.type=addon
            io.hass.name=${{ steps.meta.outputs.name }}
            io.hass.description=${{ steps.meta.outputs.description }}
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
          push: ${{ github.event_name == 'push' }}
          version: ${{ steps.meta.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    if: needs.init.outputs.changed == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Get add-on information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Normalize add-on metadata
        id: meta
        shell: bash
        env:
          RAW_VERSION: ${{ steps.info.outputs.version }}
        run: |
          # The info helper returns the raw value from config.yaml, including the
          # surrounding quotes. It must be removed for the image tags.
          value="${RAW_VERSION//\"/}"
          value="${value//\'/}"
          value="${value#"${value%%[![:space:]]*}"}"
          value="${value%"${value##*[![:space:]]}"}"
          echo "version=${value}" >> "$GITHUB_OUTPUT"

      - name: Determine image names
        id: names
        env:
          ARCH: "amd64"
        run: |
          registry_prefix="${IMAGE_PATTERN%/*}"
          image_name="${IMAGE_PATTERN##*/}"
          echo "registry_prefix=${registry_prefix}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "image=${registry_prefix}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        shell: bash
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARCHITECTURES: ${{ steps.info.outputs.architectures }}
        run: |
          set -euo pipefail
          # The manifest is created in the same package as the per-architecture
          # images ("<version>-<arch>"), because a cross-package copy is denied
          # by GHCR for the GITHUB_TOKEN.
          sources=()
          while IFS= read -r arch; do
            [[ -n "$arch" ]] && sources+=("${IMAGE}:${VERSION}-${arch}")
          done < <(jq -r '.[]' <<< "${ARCHITECTURES}")

          if [[ ${#sources[@]} -eq 0 ]]; then
            echo "::error::No architectures found"
            exit 1
          fi

          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${sources[@]}"
